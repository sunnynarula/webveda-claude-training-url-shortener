[project]
name = "url-shortener"
version = "0.1.0"
description = "A production-grade URL shortener: FastAPI, PostgreSQL and the Redis protocol"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "pytest-cov>=5",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-licenses>=5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "ASYNC", "DTZ", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"socket.getaddrinfo".msg = "Blocking DNS lookup: use the async Resolver (ADR 0004)."
"socket.gethostbyname".msg = "Blocking DNS lookup: use the async Resolver (ADR 0004)."
"redis.Redis".msg = "Synchronous client: use redis.asyncio (CLAUDE.md §2)."
"sqlalchemy.create_engine".msg = "Synchronous engine: use create_async_engine (CLAUDE.md §2)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]  # asserts; the uvicorn log smoke test runs a subprocess

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "testsupport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
xfail_strict = true
addopts = ["--strict-markers", "--strict-config"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
